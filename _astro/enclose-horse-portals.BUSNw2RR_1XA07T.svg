<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" font-family="'Space Grotesk', system-ui, sans-serif">
  <rect width="560" height="252" fill="#faf9f6"/>
  <style>
    .reach{ fill:#fff2cc; stroke:#ecd9a0; stroke-width:1.5; }
    .water{ fill:#cfe6f7; stroke:#8fbfe0; stroke-width:1.5; }
    .em   { font-size:26px; }
    .lat  { fill:none; stroke:#a9b8a0; stroke-width:1.8; stroke-dasharray:3 3; }
    .dot  { fill:#6f9c6a; }
  </style>

  <g transform="translate(126,24)">
    <!-- reachable cells (both sides) -->
    <g class="reach">
      <rect x="0" y="0" width="48" height="48"/><rect x="52" y="0" width="48" height="48"/><rect x="104" y="0" width="48" height="48"/><rect x="208" y="0" width="48" height="48"/><rect x="260" y="0" width="48" height="48"/>
      <rect x="0" y="52" width="48" height="48"/><rect x="52" y="52" width="48" height="48"/><rect x="104" y="52" width="48" height="48"/><rect x="208" y="52" width="48" height="48"/><rect x="260" y="52" width="48" height="48"/>
      <rect x="0" y="104" width="48" height="48"/><rect x="52" y="104" width="48" height="48"/><rect x="104" y="104" width="48" height="48"/><rect x="208" y="104" width="48" height="48"/><rect x="260" y="104" width="48" height="48"/>
      <rect x="0" y="156" width="48" height="48"/><rect x="52" y="156" width="48" height="48"/><rect x="104" y="156" width="48" height="48"/><rect x="208" y="156" width="48" height="48"/><rect x="260" y="156" width="48" height="48"/>
    </g>
    <!-- water wall -->
    <g class="water">
      <rect x="156" y="0" width="48" height="48"/><rect x="156" y="52" width="48" height="48"/><rect x="156" y="104" width="48" height="48"/><rect x="156" y="156" width="48" height="48"/>
    </g>

    <!-- lattice edges, per block -->
    <g class="lat">
      <line x1="24" y1="24" x2="128" y2="24"/><line x1="24" y1="76" x2="128" y2="76"/><line x1="24" y1="128" x2="128" y2="128"/><line x1="24" y1="180" x2="128" y2="180"/>
      <line x1="24" y1="24" x2="24" y2="180"/><line x1="76" y1="24" x2="76" y2="180"/><line x1="128" y1="24" x2="128" y2="180"/>
      <line x1="232" y1="24" x2="284" y2="24"/><line x1="232" y1="76" x2="284" y2="76"/><line x1="232" y1="128" x2="284" y2="128"/><line x1="232" y1="180" x2="284" y2="180"/>
      <line x1="232" y1="24" x2="232" y2="180"/><line x1="284" y1="24" x2="284" y2="180"/>
    </g>

    <!-- vertices -->
    <g class="dot">
      <circle cx="24" cy="24" r="3.2"/><circle cx="76" cy="24" r="3.2"/><circle cx="128" cy="24" r="3.2"/><circle cx="232" cy="24" r="3.2"/><circle cx="284" cy="24" r="3.2"/>
      <circle cx="24" cy="76" r="3.2"/><circle cx="76" cy="76" r="3.2"/><circle cx="232" cy="76" r="3.2"/><circle cx="284" cy="76" r="3.2"/>
      <circle cx="24" cy="128" r="3.2"/><circle cx="76" cy="128" r="3.2"/><circle cx="128" cy="128" r="3.2"/><circle cx="232" cy="128" r="3.2"/><circle cx="284" cy="128" r="3.2"/>
      <circle cx="24" cy="180" r="3.2"/><circle cx="76" cy="180" r="3.2"/><circle cx="128" cy="180" r="3.2"/><circle cx="232" cy="180" r="3.2"/><circle cx="284" cy="180" r="3.2"/>
    </g>

    <!-- teleport edge, leaping the water -->
    <path d="M128 76 C 160 16, 214 30, 232 128" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/>
    <path d="M172 30 l14 12 M186 30 l-14 12" stroke="#c0392b" stroke-width="2.4"/>

    <!-- horse + portals -->
    <text class="em" x="24"  y="190" text-anchor="middle">🐴</text>
    <text class="em" x="128" y="86"  text-anchor="middle">🌀</text>
    <text class="em" x="232" y="138" text-anchor="middle">🌀</text>
  </g>
</svg>
